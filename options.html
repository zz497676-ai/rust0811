<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>文章可读性增强器 - 设置</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 460px;
        margin: 40px auto;
        color: #1f2328;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        margin-bottom: 16px;
        box-sizing: border-box;
      }
      button {
        padding: 8px 16px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
      }
      p.hint {
        font-size: 12px;
        color: #59636e;
      }
      #saved {
        font-size: 12px;
        color: #1a7f37;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h2>设置</h2>
    <label for="apiKey">Anthropic API Key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <p class="hint">
      仅保存在浏览器本地存储中，只会用于从你的浏览器直接请求
      https://api.anthropic.com。
    </p>

    <label for="model">模型 ID</label>
    <input id="model" type="text" placeholder="例如 claude-sonnet-4-5-20250929" />
    <p class="hint">填写你在 Anthropic 账号下可用的模型 ID，具体请参考 Anthropic 官方文档。</p>

    <button id="save-btn">保存</button>
    <span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>

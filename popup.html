<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>文章可读性增强器</title>
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 14px;
        color: #1f2328;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #8c959f;
        cursor: not-allowed;
      }
      .arf-warning {
        font-size: 12px;
        color: #9a6700;
        background: #fff8c5;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 10px;
        display: none;
      }
      .arf-status {
        font-size: 12px;
        color: #59636e;
        margin-top: 8px;
        min-height: 16px;
      }
      a {
        color: #1f6feb;
      }
    </style>
  </head>
  <body>
    <h1>文章可读性增强器</h1>
    <div id="warning" class="arf-warning">
      还没有设置 Claude API Key，请先打开<a href="#" id="open-options">设置</a>。
    </div>
    <button id="run-btn">格式化本页文章</button>
    <div id="status" class="arf-status"></div>
    <script src="popup.js"></script>
  </body>
</html>
